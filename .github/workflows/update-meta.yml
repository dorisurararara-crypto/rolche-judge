name: update-meta

# 매일 자동으로 lolchess.gg 현재 패치 메타 덱을 긁어 갱신.
# Riot API key 불필요. 수동 실행도 가능 (workflow_dispatch).
on:
  schedule:
    - cron: "0 19 * * *" # 매일 04:00 KST (19:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch latest meta decks
        run: node scripts/update-meta.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- src/lib/data/meta-decks.json; then
            echo "메타 변동 없음 — 커밋 skip"
            exit 0
          fi
          git config user.name "meta-bot"
          git config user.email "meta-bot@users.noreply.github.com"
          git add src/lib/data/meta-decks.json
          git commit -m "chore(meta): lolchess 메타 자동 갱신 $(date -u +%Y-%m-%d)"
          git push
      - name: Trigger Vercel redeploy
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK secret 미설정 — 재배포 skip (데이터만 커밋됨)"
            exit 0
          fi
          curl -s -X POST "$VERCEL_DEPLOY_HOOK" && echo "재배포 트리거됨"
